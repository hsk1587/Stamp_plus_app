<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>브릿지커피 단골 적립</title>

  <script>
    /* ################################################################
       ##                                                            ##
       ##   ★★★  고치는 곳은 전부 여기 한곳에 모여 있습니다  ★★★    ##
       ##                                                            ##
       ################################################################

       ■ 먼저 알아두세요
         - 아래 서버주소 가 비어 있으면 "연습 모드"예요. 연습용 목록에 적어 둔 숫자와 개수만 보여 줘요.
         - 서버주소 에 구글 시트 연결 주소를 붙여 넣으면 "진짜 모드"가 돼요.
           그러면 구글 시트에 저장된 진짜 스탬프 개수를 보여 줘요. (연습용 목록은 쓰이지 않아요.)
           주소 얻는 방법은 같은 폴더의 「구글시트_설정방법.md」에 있어요.
         - 서버주소 는 사장님 화면(admin.html)의 서버주소 와 똑같이 맞춰야 해요.
         - 고친 뒤에는 저장(Ctrl + S) → 브라우저에서 새로고침(F5) 하면 바뀐 모습이 보여요.
         - 따옴표(" ")와 쉼표(,)는 지우지 마세요. 글자만 바꾸세요.

       ■ 가게 이름 바꾸기
         → 아래 가게이름 의 따옴표 안 글자만 고치세요.

       ■ 몇 개를 모으면 보상인가요? (처음은 10개)
         → 아래 목표개수 의 숫자를 바꾸세요. 예) 8 로 바꾸면 동그라미도 8개가 돼요.
           (숫자는 4 ~ 12 사이를 추천해요. 너무 많으면 화면이 복잡해져요.)

       ■ 보상 이름 바꾸기
         → 아래 보상이름 의 글자를 고치세요. 예) "무료 음료" → "아메리카노 1잔"

       ■ 연습용 목록 고치기 (화면이 어떻게 보이는지 확인하는 용도예요)
         → 한 줄이 손님 한 명이에요.  "뒷4자리": 스탬프개수,
           예) "1234": 3,   ← 뒷 4자리가 1234 인 손님은 3개 모았다는 뜻이에요.
         → 줄을 늘리려면 한 줄을 복사해서 붙여넣고 숫자만 바꾸세요.
         → 뒷 4자리는 반드시 따옴표 안에 숫자 4개로 적어요. 개수에는 따옴표를 붙이지 않아요.

       ■ ⚠ 꼭 지켜 주세요 (개인정보)
         → 이 목록에는 "진짜 손님의 번호"를 절대 넣지 마세요.
           이 파일을 열 수 있는 사람은 누구나 코드를 볼 수 있어서, 목록이 그대로 다 보여요.
         → 진짜 손님 정보를 다루는 저장 기능은 안전한 방법을 정한 다음에 따로 만들어요.
    */

    const 가게이름 = "브릿지커피";
    const 목표개수 = 10;
    const 보상이름 = "무료 음료";

    /* 구글 시트 연결 주소 (https://script.google.com/macros/s/.../exec 로 끝나는 주소)
       처음에는 비워 두세요: const 서버주소 = ""; */
    const 서버주소 = "";

    const 연습용목록 = {
      "1234": 3,    /* 3개 모은 손님 */
      "5678": 10,   /* 10개 다 모은 손님 (축하 화면이 떠요) */
      "1111": 10,   /* 임시로 넣은 번호: 10개 다 모은 손님 (축하 화면이 떠요) */
      "0000": 0,    /* 아직 하나도 없는 손님 */
      "4321": 7,    /* 7개 모은 손님 */
      "2468": 9     /* 하나만 더 모으면 되는 손님 */
    };
  </script>

  <style>
    :root {
      --갈색: #4A3728;   /* 배경, 제목 색 */
      --크림: #F5EFE6;   /* 카드, 본문 색 */
      --연갈색: #6a4f3a; /* 보조 글씨 색 */
      --강조: #c98a4b;   /* 채워진 스탬프, 포인트 색 */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* 글꼴: 고운 돋움을 먼저 쓰고, 없으면 맑은 고딕을 씁니다 */
      font-family: "고운 돋움", "GowunDodum", "Gowun Dodum", "맑은 고딕", "Malgun Gothic", sans-serif;
      background: linear-gradient(160deg, #5a4331 0%, var(--갈색) 45%, #33261b 100%);
      background-attachment: fixed;
      color: var(--크림);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
    }

    /* 배경의 은은한 빛 번짐 (유리 효과가 잘 보이도록) */
    body::before, body::after {
      content: ""; position: fixed; border-radius: 50%; filter: blur(80px);
      z-index: 0; pointer-events: none;
    }
    body::before { width: 300px; height: 300px; background: #a8703f; top: -80px; right: -100px; opacity: .55; }
    body::after  { width: 340px; height: 340px; background: #7a5237; bottom: 60px; left: -140px; opacity: .6; }

    .화면 { position: relative; z-index: 1; max-width: 430px; margin: 0 auto; padding: 40px 20px 56px; }

    /* ---------- 맨 위 ---------- */
    header { text-align: center; padding: 20px 0 30px; }
    header .작은글 { font-size: 14px; opacity: .8; letter-spacing: 1px; }
    header h1 { font-size: 38px; margin: 10px 0 12px; letter-spacing: 2px; word-break: keep-all; }
    header .안내 { font-size: 17px; opacity: .92; word-break: keep-all; }

    /* ---------- 글래스(유리) 카드 ---------- */
    .유리 {
      background: linear-gradient(160deg, rgba(255, 252, 247, 0.84), rgba(245, 239, 230, 0.7));
      color: var(--갈색);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 10px 32px rgba(20, 12, 6, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.7);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      padding: 26px 22px;
      margin-bottom: 20px;
    }
    .유리 h2 { font-size: 19px; margin-bottom: 6px; }
    .설명 { font-size: 15px; color: var(--연갈색); word-break: keep-all; }

    /* ---------- 번호 입력 ---------- */
    .입력줄 { display: flex; gap: 10px; margin-top: 16px; }
    #번호칸 {
      flex: 1; min-width: 0; min-height: 58px;
      padding: 10px 14px;
      font-family: inherit; font-size: 26px; font-weight: bold; letter-spacing: 8px; text-align: center;
      color: var(--갈색);
      background: rgba(255, 255, 255, 0.88);
      border: 1.5px solid rgba(74, 55, 40, 0.3);
      border-radius: 16px;
    }
    #번호칸::placeholder { letter-spacing: 4px; font-size: 20px; font-weight: normal; color: rgba(106, 79, 58, 0.55); }
    #번호칸:focus { outline: 3px solid rgba(201, 138, 75, 0.5); border-color: var(--강조); }

    button {
      font-family: inherit; font-weight: bold; cursor: pointer; border: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.98); }
    #확인버튼 {
      min-height: 58px; min-width: 96px; padding: 0 22px;
      font-size: 19px; color: var(--크림); background: var(--갈색);
      border-radius: 16px; box-shadow: 0 8px 20px rgba(74, 55, 40, 0.45);
    }
    .오류 { margin-top: 12px; padding: 11px 14px; border-radius: 12px; font-size: 15px;
            background: rgba(140, 59, 46, 0.12); color: #8c3b2e; }
    .오류[hidden] { display: none; }
    .작은안내 { margin-top: 12px; font-size: 13px; color: var(--연갈색); }

    /* ---------- 스탬프 칸 ---------- */
    #결과카드[hidden] { display: none; }
    .스탬프판 {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px 10px;
      margin: 20px 0 22px;
    }
    .스탬프 {
      aspect-ratio: 1; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; font-weight: bold;
      color: rgba(106, 79, 58, 0.45);
      background: rgba(74, 55, 40, 0.07);
      border: 2px dashed rgba(74, 55, 40, 0.3);
    }
    .스탬프.채움 {
      color: #fff; font-size: 24px;
      background: radial-gradient(circle at 35% 30%, #e0a766, var(--강조) 55%, #a8702f);
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 5px 12px rgba(120, 70, 20, 0.4), inset 0 2px 3px rgba(255, 255, 255, 0.5);
      animation: 톡 .35s ease-out backwards;
    }
    @keyframes 톡 { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .결과문구 { text-align: center; font-size: 20px; font-weight: bold; line-height: 1.5; word-break: keep-all; }
    .결과문구 small { display: block; margin-top: 4px; font-size: 15px; font-weight: normal; color: var(--연갈색); }

    /* ---------- 축하 화면 ---------- */
    #축하막 {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: rgba(30, 20, 12, 0.6);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    }
    #축하막[hidden] { display: none; }
    .축하카드 {
      position: relative; z-index: 2; width: 100%; max-width: 350px;
      text-align: center; margin: 0; padding: 36px 24px 28px;
      animation: 튀어나옴 .5s cubic-bezier(.2, 1.3, .4, 1);
    }
    @keyframes 튀어나옴 { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .축하카드 .큰그림 { font-size: 64px; line-height: 1.2; }
    .축하카드 h2 { font-size: 28px; margin: 8px 0 10px; }
    .축하카드 p { font-size: 18px; word-break: keep-all; }
    .축하카드 .보상 { margin: 14px 0 6px; padding: 14px; border-radius: 16px; font-size: 22px; font-weight: bold;
                      color: #fff; background: linear-gradient(135deg, #d99a55, #b8793a); }
    .축하카드 .직원안내 { font-size: 14px; color: var(--연갈색); margin-top: 8px; }
    #닫기버튼 {
      margin-top: 22px; width: 100%; min-height: 56px; font-size: 19px;
      color: var(--크림); background: var(--갈색); border-radius: 16px;
      box-shadow: 0 8px 20px rgba(74, 55, 40, 0.45);
    }
    .조각 {
      /* 축하 화면(z-index 50)보다 위에 있어야 또렷하게 보여요 */
      position: fixed; width: 12px; height: 18px; border-radius: 3px; z-index: 100;
      pointer-events: none;
    }

    @media (max-width: 340px) {
      .화면 { padding-left: 14px; padding-right: 14px; }
      #번호칸 { font-size: 22px; letter-spacing: 5px; }
      #확인버튼 { min-width: 80px; padding: 0 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .스탬프.채움, .축하카드 { animation: none; }
    }
  </style>
</head>
<body>
  <div class="화면">

    <!-- ===== 1. 맨 위: 가게 이름과 안내 ===== -->
    <header>
      <div class="작은글">☕ 단골 적립 ☕</div>
      <h1 id="가게이름표시"></h1>
      <div class="안내">단골 적립 스탬프를 확인해 보세요</div>
    </header>

    <!-- ===== 2. 번호 입력 ===== -->
    <section class="유리">
      <h2>휴대폰 번호 뒷 4자리</h2>
      <div class="설명">전화번호 맨 끝 숫자 4개만 입력해 주세요.</div>
      <div class="입력줄">
        <input id="번호칸" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4"
               placeholder="0000" autocomplete="off" aria-label="휴대폰 번호 뒷 4자리">
        <button id="확인버튼" type="button">확인</button>
      </div>
      <div class="오류" id="오류" hidden role="alert"></div>
      <div class="작은안내" id="작은안내"></div>
    </section>

    <!-- ===== 3. 결과: 스탬프 칸과 안내 문구 ===== -->
    <section class="유리" id="결과카드" hidden>
      <h2 id="결과제목">내 스탬프</h2>
      <div class="스탬프판" id="스탬프판"></div>
      <div class="결과문구" id="결과문구"></div>
    </section>

  </div>

  <!-- ===== 축하 화면 (목표 개수를 다 모으면 나와요) ===== -->
  <div id="축하막" hidden>
    <div class="유리 축하카드" role="dialog" aria-modal="true" aria-labelledby="축하제목">
      <div class="큰그림">🎉</div>
      <h2 id="축하제목">축하해요!</h2>
      <p id="축하글"></p>
      <div class="보상" id="축하보상"></div>
      <div class="직원안내">직원에게 이 화면을 보여 주세요.</div>
      <button id="닫기버튼" type="button">닫기</button>
    </div>
  </div>

  <script>
    /* ===== 아래는 화면을 움직이게 하는 부분입니다. 보통은 고치지 않아도 됩니다. ===== */

    const 번호칸 = document.getElementById("번호칸");
    const 오류칸 = document.getElementById("오류");
    const 결과카드 = document.getElementById("결과카드");
    const 스탬프판 = document.getElementById("스탬프판");
    const 결과문구 = document.getElementById("결과문구");
    const 축하막 = document.getElementById("축하막");

    document.getElementById("가게이름표시").textContent = 가게이름;
    document.title = 가게이름 + " 단골 적립";

    /* 숫자 이외의 글자는 입력되지 않게 지워요 */
    번호칸.addEventListener("input", function () {
      번호칸.value = 번호칸.value.replace(/[^0-9]/g, "").slice(0, 4);
    });
    번호칸.addEventListener("keydown", function (e) { if (e.key === "Enter") 확인(); });
    document.getElementById("확인버튼").addEventListener("click", 확인);

    function 오류보이기(글) { 오류칸.textContent = 글; 오류칸.hidden = false; 결과카드.hidden = true; }

    document.getElementById("작은안내").textContent = 서버주소
      ? "입력한 번호는 스탬프 확인에만 쓰고, 이 화면에는 저장하지 않아요."
      : "연습 모드예요. 입력한 번호는 저장하지 않아요.";

    const 확인버튼 = document.getElementById("확인버튼");
    let 확인중 = false;

    async function 확인() {
      if (확인중) return;
      오류칸.hidden = true;
      const 번호 = 번호칸.value;
      if (!/^[0-9]{4}$/.test(번호)) { 오류보이기("숫자 4자리를 입력해 주세요."); return; }

      /* 연습 모드 (서버주소가 비어 있을 때): 목록에 없는 번호는 0개로 봐요 */
      if (!서버주소) {
        const 모은개수 = Object.prototype.hasOwnProperty.call(연습용목록, 번호) ? 연습용목록[번호] : 0;
        스탬프그리기(Math.min(모은개수, 목표개수));
        return;
      }

      /* 진짜 모드: 구글 시트에 물어봐요 */
      확인중 = true;
      확인버튼.disabled = true;
      확인버튼.textContent = "확인 중…";
      try {
        const 응답 = await 서버에물어보기(번호);
        if (응답 && 응답.성공) 스탬프그리기(Math.min(Number(응답.개수) || 0, 목표개수));
        else 오류보이기((응답 && 응답.오류) || "지금은 확인할 수 없어요. 잠시 후 다시 시도해 주세요.");
      } catch (오류) {
        오류보이기("지금은 확인할 수 없어요. 인터넷 연결을 확인하고 잠시 후 다시 시도해 주세요.");
      } finally {
        확인중 = false;
        확인버튼.disabled = false;
        확인버튼.textContent = "확인";
      }
    }

    /* 구글 시트 연결 코드에 "이 번호 몇 개야?" 하고 물어봐요 (15초 안에 답이 없으면 포기) */
    async function 서버에물어보기(번호) {
      const 제어기 = new AbortController();
      const 타이머 = setTimeout(function () { 제어기.abort(); }, 15000);
      try {
        const 답 = await fetch(서버주소, {
          method: "POST",
          body: JSON.stringify({ 동작: "조회", 번호: 번호 }),   /* 글자 형태로 보내면 별도 허락 절차 없이 통과돼요 */
          signal: 제어기.signal
        });
        return await 답.json();
      } finally {
        clearTimeout(타이머);
      }
    }

    function 스탬프그리기(개수) {
      스탬프판.innerHTML = "";
      for (let i = 1; i <= 목표개수; i++) {
        const 칸 = document.createElement("div");
        칸.className = "스탬프" + (i <= 개수 ? " 채움" : "");
        칸.textContent = i <= 개수 ? "☕" : i;
        if (i <= 개수) 칸.style.animationDelay = (i * 0.06) + "s";
        스탬프판.appendChild(칸);
      }

      const 남은 = 목표개수 - 개수;
      if (개수 >= 목표개수) {
        결과문구.innerHTML = "🎉 " + 목표개수 + "개를 다 모았어요!<small>" + 보상이름 + "을(를) 받을 수 있어요</small>";
      } else if (개수 === 0) {
        결과문구.innerHTML = "아직 모은 스탬프가 없어요<small>" + 목표개수 + "개 모으면 " + 보상이름 + "!</small>";
      } else {
        결과문구.innerHTML = 개수 + "개 모았어요!<small>" + 남은 + "개 더 모으면 " + 보상이름 + "</small>";
      }
      결과카드.hidden = false;
      결과카드.scrollIntoView({ behavior: "smooth", block: "nearest" });

      if (개수 >= 목표개수) 축하보이기();
    }

    /* ----- 축하 화면 ----- */
    function 축하보이기() {
      document.getElementById("축하글").textContent = 스탬프문구();
      document.getElementById("축하보상").textContent = "🎁 " + 보상이름;
      축하막.hidden = false;
      document.getElementById("닫기버튼").focus();
      색종이뿌리기();
    }
    function 스탬프문구() { return 목표개수 + "개를 모두 모으셨어요. 단골이 되어 주셔서 고마워요!"; }

    /* 꽃가루(색종이): 화면 가운데에서 "팡!" 하고 터진 뒤, 아래로 떨어지면서 사라져요.
       [고치는 곳] 개수는 꽃가루개수, 색은 색들 을 바꾸세요. */
    const 꽃가루개수 = 90;
    function 색종이뿌리기() {
      document.querySelectorAll(".조각").forEach(function (c) { c.remove(); });
      const 색들 = ["#e0a766", "#c98a4b", "#f5efe6", "#8c3b2e", "#7a5237", "#ffd98a", "#ff8fa3", "#7ec8e3"];
      const 가운데x = window.innerWidth / 2;
      const 가운데y = window.innerHeight * 0.4;

      for (let i = 0; i < 꽃가루개수; i++) {
        const 조각 = document.createElement("div");
        조각.className = "조각";
        조각.style.left = 가운데x + "px";
        조각.style.top = 가운데y + "px";
        조각.style.background = 색들[i % 색들.length];
        document.body.appendChild(조각);

        /* 사방으로 퍼지는 방향과 거리 (위쪽으로 더 많이 터져요) */
        const 각도 = Math.random() * Math.PI * 2;
        const 거리 = 120 + Math.random() * Math.min(260, window.innerWidth * 0.6);
        const 옆 = Math.cos(각도) * 거리;
        const 위아래 = Math.sin(각도) * 거리 * 0.8 - 60;
        const 돌기 = (Math.random() * 900 - 450);
        const 시간 = 2200 + Math.random() * 1600;

        if (조각.animate) {
          const 움직임 = 조각.animate([
            { transform: "translate(-50%, -50%) scale(.3) rotate(0deg)", opacity: 1 },
            { transform: "translate(" + 옆 + "px, " + 위아래 + "px) scale(1) rotate(" + (돌기 / 2) + "deg)", opacity: 1, offset: 0.3 },
            { transform: "translate(" + (옆 * 1.15) + "px, " + (위아래 + window.innerHeight * 0.8) + "px) scale(1) rotate(" + 돌기 + "deg)", opacity: 0 }
          ], { duration: 시간, easing: "cubic-bezier(.2, .6, .4, 1)", fill: "forwards" });
          움직임.onfinish = function () { 조각.remove(); };
        } else {
          setTimeout(function () { 조각.remove(); }, 시간);
        }
      }
    }

    function 축하닫기() {
      축하막.hidden = true;
      document.querySelectorAll(".조각").forEach(function (c) { c.remove(); });
    }
    document.getElementById("닫기버튼").addEventListener("click", 축하닫기);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !축하막.hidden) 축하닫기(); });
  </script>
</body>
</html>
